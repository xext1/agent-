<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>云帆科技 · 智能服务台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
        body { display: flex; flex-direction: column; background: #f5f6f8; }

        /* 顶部 */
        .header {
            height: 56px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; background: #2563eb; color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }
        .header .logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 600; }
        .header .logo::before { content: "🤖"; font-size: 24px; }
        .header .user-info { display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .header .logout-btn {
            background: rgba(255,255,255,.2); border: none; color: white;
            padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 13px;
            transition: background .2s;
        }
        .header .logout-btn:hover { background: rgba(255,255,255,.3); }

        /* 聊天区 */
        .chat-area { flex: 1; overflow-y: auto; padding: 24px 16px; }
        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

        .msg { display: flex; margin-bottom: 20px; animation: fadeIn .25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .msg .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }
        .msg .bubble {
            max-width: 70%; padding: 12px 16px; border-radius: 12px;
            line-height: 1.65; font-size: 15px; white-space: pre-wrap;
            word-break: break-word; margin-top: 4px;
        }

        .msg.user { flex-direction: row-reverse; }
        .msg.user .avatar { background: #2563eb; color: white; }
        .msg.user .bubble { background: #2563eb; color: white; margin-right: 10px; border-top-right-radius: 4px; }

        .msg.ai .avatar { background: #e0e7ff; color: #2563eb; }
        .msg.ai .bubble {
            background: white; color: #1f2937; margin-left: 10px;
            border-top-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }

        .typing span {
            display: inline-block; width: 6px; height: 6px; background: #9ca3af;
            border-radius: 50%; margin: 0 2px; animation: blink 1.4s infinite both;
        }
        .typing span:nth-child(2) { animation-delay: .2s; }
        .typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: .2; transform: scale(.8); }
            40%           { opacity: 1;  transform: scale(1); }
        }

        /* 输入区 */
        .input-area { padding: 16px; background: white; border-top: 1px solid #e5e7eb; }
        .input-box { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
        .input-box textarea {
            flex: 1; resize: none; height: 52px; padding: 12px 16px;
            font-size: 15px; border: 1px solid #d1d5db; border-radius: 26px;
            outline: none; transition: border-color .2s; font-family: inherit;
        }
        .input-box textarea:focus { border-color: #2563eb; }
        .input-box textarea::placeholder { color: #9ca3af; }

        .send-btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: #2563eb; color: white; border: none; cursor: pointer;
            font-size: 20px; display: flex; align-items: center; justify-content: center;
            transition: background .2s, transform .1s; flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) { background: #1d4ed8; }
        .send-btn:active:not(:disabled) { transform: scale(.95); }
        .send-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        .welcome { text-align: center; padding: 40px 20px; color: #6b7280; }
        .welcome h2 { color: #1f2937; margin-bottom: 8px; font-size: 20px; }
        .welcome p { font-size: 14px; }
    </style>
</head>
<body>

<!-- 顶部 -->
<div class="header">
    <div class="logo">小帆 · 企业服务台</div>
    <div class="user-info">
        <span>👤 <span id="username">加载中...</span></span>
        <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>
</div>

<!-- 聊天区 -->
<div class="chat-area" id="chatArea"></div>

<!-- 输入区 -->
<div class="input-area">
    <div class="input-box">
        <textarea id="input" placeholder="问我任何问题，比如：公司密码要求是什么？"
                  onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()">➤</button>
    </div>
</div>

<script>
    // ========== 鉴权：页面加载时先检查 token ==========
    const token = localStorage.getItem("token");
    if (!token) {
        window.location.href = "/login";  // 没 token 直接跳登录页
    } else {
        // 验证 token 是不是真的（防过期/被篡改）
        fetch("/api/v1/auth/me", {
            headers: { Authorization: "Bearer " + token }
        }).then(r => {
            if (!r.ok) { localStorage.clear(); window.location.href = "/login"; }
            else r.json().then(u => document.getElementById("username").textContent = u.username);
        }).catch(() => { localStorage.clear(); window.location.href = "/login"; });
    }

    function logout() {
        localStorage.clear();
        window.location.href = "/login";
    }

    // ========== 聊天逻辑 ==========
    const chatArea = document.getElementById("chatArea");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");

    function handleKey(e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    }

    async function send() {
        const text = input.value.trim();
        if (!text || sendBtn.disabled) return;
        input.value = "";
        sendBtn.disabled = true;

        appendMsg("user", text);
        const typingEl = appendTyping();

        try {
            const resp = await fetch("/api/v1/chat/stream", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token,  // ← 每个请求带 token
                },
                body: JSON.stringify({ message: text })
            });

            if (resp.status === 401) {
                // token 过期了
                localStorage.clear();
                window.location.href = "/login";
                return;
            }

            typingEl.remove();
            const bubbleEl = appendMsg("ai", "");

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                fullText += decoder.decode(value);
                bubbleEl.querySelector(".bubble").textContent = fullText;
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        } catch (err) {
            typingEl.remove();
            appendMsg("ai", "抱歉，服务暂时不可用，请稍后再试。");
        }

        sendBtn.disabled = false;
        input.focus();
    }

    function appendMsg(role, text) {
        const welcome = chatArea.querySelector(".welcome");
        if (welcome) welcome.remove();

        const wrap = document.createElement("div");
        wrap.className = "msg " + role;
        wrap.innerHTML = `
            <div class="avatar">${role === "user" ? "我" : "🤖"}</div>
            <div class="bubble"></div>
        `;
        wrap.querySelector(".bubble").textContent = text;
        chatArea.appendChild(wrap);
        chatArea.scrollTop = chatArea.scrollHeight;
        return wrap;
    }

    function appendTyping() {
        const wrap = document.createElement("div");
        wrap.className = "msg ai";
        wrap.innerHTML = `
            <div class="avatar">🤖</div>
            <div class="bubble typing"><span></span><span></span><span></span></div>
        `;
        chatArea.appendChild(wrap);
        chatArea.scrollTop = chatArea.scrollHeight;
        return wrap;
    }
</script>
</body>
</html>
